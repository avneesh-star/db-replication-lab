# Load balancer in front of the API instances (HTTP mode).
# Scale the API with:  docker compose up -d --scale api=4
# server-template lists up to 12 slots; HAProxy fills them from the DNS name "api", which Docker resolves to
# every running API container, and it re-checks DNS every second, so instances come and go without a restart.
global
    maxconn 20000

defaults
    mode http
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    option http-keep-alive

resolvers docker
    nameserver dns1 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 1s

# Stats page: http://localhost:7003
listen stats
    bind *:7000
    stats enable
    stats uri /
    stats refresh 2s

frontend web
    bind *:8080
    default_backend api

backend api
    balance leastconn
    # /healthz does not touch the database, so a database problem does not take every API instance out of rotation.
    option httpchk GET /healthz
    http-check expect status 200
    default-server inter 2s fall 2 rise 1 resolvers docker init-addr none
    server-template api 1-12 api:8080 check

    # If an instance dies, retry the request on another one instead of failing it:
    #   retries / redispatch  re-send when the connection to the chosen instance fails
    #   retry-on              also retry when it closes the connection without answering
    #   no retry for POST     a request that was already sent is only re-sent when it is a GET
    retries 3
    option redispatch
    retry-on conn-failure empty-response
    http-request disable-l7-retry if METH_POST
