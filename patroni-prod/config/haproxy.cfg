global
    maxconn 1000

defaults
    mode tcp
    timeout connect 5s
    timeout client 30m
    timeout server 30m

resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 1s

# Stats page and Prometheus metrics.
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 2s

frontend metrics
    mode http
    bind *:8405
    http-request use-service prometheus-exporter if { path /metrics }

# Writes: only the node whose /primary check returns 200.
listen primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server pg-node1 pg-node1:5432 check port 8008
    server pg-node2 pg-node2:5432 check port 8008
    server pg-node3 pg-node3:5432 check port 8008

# Reads: every healthy replica. leastconn favours the replica with fewer open connections.
listen replicas
    bind *:5001
    balance leastconn
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server pg-node1 pg-node1:5432 check port 8008
    server pg-node2 pg-node2:5432 check port 8008
    server pg-node3 pg-node3:5432 check port 8008
