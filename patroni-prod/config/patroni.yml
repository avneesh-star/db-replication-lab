# Shared Patroni config. Per-node names/addresses and all passwords come from
# PATRONI_* environment variables (see docker-compose.yml and .env); nothing secret lives here.
scope: lab-prod

restapi:
  listen: 0.0.0.0:8008           # GET endpoints (/primary, /replica, /health, /metrics) are open;
                                 # changing actions (switchover, restart) need the REST API password

etcd3:
  hosts: etcd1:2379,etcd2:2379,etcd3:2379

bootstrap:
  dcs:
    ttl: 30                      # production-typical: a leader must miss its renewals for 30 s to be replaced
    loop_wait: 10
    retry_timeout: 10            # constraint: loop_wait + 2 * retry_timeout <= ttl
    maximum_lag_on_failover: 1048576
    synchronous_mode: true       # a commit is acknowledged only after one standby has it
    synchronous_node_count: 1    # so promoting that standby loses no acknowledged commit
    synchronous_mode_strict: false   # if no standby is available, keep accepting writes (async) instead of stopping
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        wal_log_hints: "on"
        wal_keep_size: 256MB
        password_encryption: scram-sha-256
        max_connections: 200
        shared_buffers: 256MB
        # WAL archiving: every completed WAL segment is copied to /archive (a stand-in for S3 or GCS),
        # which is what point-in-time recovery and replicas that fall far behind use.
        archive_mode: "on"
        archive_timeout: 60
        archive_command: "test ! -f /archive/%f && cp %p /archive/%f"
        restore_command: "cp /archive/%f %p"
        # Logging you want when something goes wrong at 3 a.m.
        log_connections: "on"
        log_disconnections: "on"
        log_checkpoints: "on"
        log_lock_waits: "on"
        log_min_duration_statement: 500
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    - local all all trust                              # unix socket inside the container only
    - host replication replicator all scram-sha-256
    - host all all all scram-sha-256
  post_bootstrap: sh /config/post_bootstrap.sh

postgresql:
  listen: 0.0.0.0:5432
  data_dir: /data/pg
  bin_dir: /usr/lib/postgresql/16/bin
  authentication:
    superuser:
      username: postgres        # password: PATRONI_SUPERUSER_PASSWORD
    replication:
      username: replicator      # password: PATRONI_REPLICATION_PASSWORD

tags:
  nofailover: false
  noloadbalance: false
