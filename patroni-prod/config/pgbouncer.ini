; PgBouncer: many client connections share a small number of real Postgres connections.
; Postgres allows 200 connections in total (max_connections), and every API instance, with its two pools,
; wants its own. PgBouncer keeps the server side small no matter how many API instances there are.
; (PgBouncer does not allow comments at the end of a setting line, so every comment sits on its own line.)
;
; Two virtual databases, both going through HAProxy so failover still works:
;   lab     -> the primary endpoint  (writes)
;   lab_ro  -> the replica endpoint  (reads)
[databases]
lab = host=haproxy1 port=5000 dbname=lab
lab_ro = host=haproxy1 port=5001 dbname=lab

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
; written at container start from APP_DB_PASSWORD, never stored in the repo
auth_file = /tmp/userlist.txt

; Transaction pooling: a server connection is held only for the length of one transaction.
; Session state such as SET or advisory locks does not survive between statements; this app uses none.
pool_mode = transaction

; connections the API instances may open to PgBouncer
max_client_conn = 3000
; real Postgres connections per (database, user): 20 for writes and 20 for reads
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 2
server_idle_timeout = 60
; a client waits at most this many seconds for a free server connection
query_wait_timeout = 15

ignore_startup_parameters = extra_float_digits,options
admin_users = app_user
stats_users = app_user
log_connections = 0
log_disconnections = 0
