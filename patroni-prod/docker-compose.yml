# Production-style Patroni cluster.
#
#   3 x etcd      leader lock store; survives the loss of one member
#   3 x Postgres  Patroni-managed, synchronous replication, WAL archiving
#   2 x HAProxy   redundant entry points: :5000 primary, :5001 replicas
#   Prometheus    metrics and alert rules for Patroni, etcd and HAProxy
#   api           the .NET app, connecting with a least-privilege role to both HAProxy instances
#
# Secrets come from .env (copy .env.example and fill it in).
#
#   docker compose up -d --build
#   docker compose run --rm backup          take a base backup from a replica
#   bash failover-test.sh
#   docker compose down -v                  reset everything
name: patroni-prod

x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.14
  restart: unless-stopped

x-node: &node
  build: ../patroni
  image: patroni-lab-node:pg16
  restart: unless-stopped
  depends_on: [etcd1, etcd2, etcd3]
  deploy:
    resources:
      limits: { cpus: "${DB_CPUS:-1.0}", memory: "${DB_MEM:-1g}" }   # raise to test vertical scaling
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:8008/health"]
    interval: 5s
    timeout: 3s
    retries: 60
  stop_grace_period: 30s

x-node-env: &node-env
  PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
  PATRONI_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?}
  PATRONI_RESTAPI_USERNAME: patroni
  PATRONI_RESTAPI_PASSWORD: ${PATRONI_API_PASSWORD:?}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
  MONITOR_PASSWORD: ${MONITOR_PASSWORD:?}

x-haproxy: &haproxy
  image: haproxy:2.9-alpine
  restart: unless-stopped
  volumes:
    - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
  depends_on: [pg-node1, pg-node2, pg-node3]

services:
  # ---- etcd: three members, so the cluster keeps quorum if one fails -------------------
  etcd1:
    <<: *etcd
    hostname: etcd1
    command:
      - etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=lab-prod
      - --initial-cluster-state=new
    volumes: [etcd1-data:/etcd-data]

  etcd2:
    <<: *etcd
    hostname: etcd2
    command:
      - etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=lab-prod
      - --initial-cluster-state=new
    volumes: [etcd2-data:/etcd-data]

  etcd3:
    <<: *etcd
    hostname: etcd3
    command:
      - etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=lab-prod
      - --initial-cluster-state=new
    volumes: [etcd3-data:/etcd-data]

  # ---- PostgreSQL + Patroni: no host ports, reached only through HAProxy ---------------
  pg-node1:
    <<: *node
    hostname: pg-node1
    environment:
      <<: *node-env
      PATRONI_NAME: pg-node1
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-node1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-node1:5432
    volumes:
      - ./config:/config:ro
      - node1-data:/data/pg
      - wal-archive:/archive

  pg-node2:
    <<: *node
    hostname: pg-node2
    environment:
      <<: *node-env
      PATRONI_NAME: pg-node2
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-node2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-node2:5432
    volumes:
      - ./config:/config:ro
      - node2-data:/data/pg
      - wal-archive:/archive

  pg-node3:
    <<: *node
    hostname: pg-node3
    environment:
      <<: *node-env
      PATRONI_NAME: pg-node3
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-node3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-node3:5432
    volumes:
      - ./config:/config:ro
      - node3-data:/data/pg
      - wal-archive:/archive

  # A fourth Patroni node: one more read replica. Not started by default; add it with
  #   docker compose --profile extra-replica up -d pg-node4
  pg-node4:
    <<: *node
    hostname: pg-node4
    profiles: ["extra-replica"]
    environment:
      <<: *node-env
      PATRONI_NAME: pg-node4
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-node4:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-node4:5432
    volumes:
      - ./config:/config:ro
      - node4-data:/data/pg
      - wal-archive:/archive

  # ---- Two HAProxy instances: clients can use either, so one failing is not an outage --
  haproxy1:
    <<: *haproxy
    hostname: haproxy1
    ports:
      - "5460:5000"        # primary
      - "5461:5001"        # replicas
      - "7001:7000"        # stats

  haproxy2:
    <<: *haproxy
    hostname: haproxy2
    ports:
      - "5462:5000"
      - "5463:5001"
      - "7002:7000"

  # ---- Monitoring ----------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  # Database metrics (connections, transactions, cache hits, WAL archiving). It connects
  # through HAProxy's write endpoint, so it always follows the current primary.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://monitor:${MONITOR_PASSWORD:?}@haproxy1:5000/lab?sslmode=disable"
    depends_on: [haproxy1]

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports: ["3001:3000"]              # http://localhost:3001  (user admin, password GRAFANA_PASSWORD in .env)
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/postgres-ha.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  # ---- Cache ---------------------------------------------------------------------------
  # A pure cache: no persistence (it can always be rebuilt from Postgres), a memory cap, and LRU
  # eviction so a full cache drops the least recently used entries instead of refusing writes.
  # Redis runs commands on one thread, so the 1-CPU limit matches how it uses CPU.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?copy .env.example to .env}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384m }

  # ---- Application ---------------------------------------------------------------------
  api:
    build: ../dotnet/LinkShortener
    restart: on-failure
    # No host port: several instances can run (docker compose up -d --scale api=N) behind the "lb" service.
    environment:
      # CACHE_ENABLED=false turns the Redis cache off without rebuilding, for before/after benchmarks.
      # WRITE_BATCHING=true groups concurrent creates into one multi-row INSERT per commit (see WriteBatcher.cs).
      Writes__Batch__Enabled: "${WRITE_BATCHING:-false}"
      Writes__Batch__MaxSize: "${BATCH_MAX:-100}"
      Writes__Batch__Workers: "${BATCH_WORKERS:-4}"
      # L1_CACHE=true adds a small in-process cache in front of Redis (see LocalCache.cs).
      Cache__L1__Enabled: "${L1_CACHE:-false}"
      Cache__L1__TtlSeconds: "30"
      # HTTP_CACHE_SECONDS>0 adds Cache-Control: public, max-age=N to successful lookups, so browsers and CDNs can cache them.
      Http__CacheMaxAgeSeconds: "${HTTP_CACHE_SECONDS:-0}"
      Cache__Enabled: "${CACHE_ENABLED:-true}"
      Cache__TtlSeconds: "300"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD},abortConnect=false,connectTimeout=500,syncTimeout=200,asyncTimeout=200"
      # Where the database connections go. Default: straight to the two HAProxy instances (the driver moves to
      # the second if the first is unreachable). With PgBouncer: DB_WRITER_HOST=pgbouncer DB_WRITER_PORT=6432
      # DB_READER_HOST=pgbouncer DB_READER_PORT=6432 DB_READER_DB=lab_ro DB_EXTRA=";No Reset On Close=true"
      # app_user can read and write rows but cannot change the schema.
      ConnectionStrings__Writer: "Host=${DB_WRITER_HOST:-haproxy1,haproxy2};Port=${DB_WRITER_PORT:-5000};Database=${DB_WRITER_DB:-lab};Username=app_user;Password=${APP_DB_PASSWORD};Timeout=3;Command Timeout=10;Keepalive=10;Minimum Pool Size=${DB_MIN_POOL:-0};Maximum Pool Size=${DB_POOL:-20};Connection Lifetime=60${DB_EXTRA:-}"
      ConnectionStrings__Reader: "Host=${DB_READER_HOST:-haproxy1,haproxy2};Port=${DB_READER_PORT:-5001};Database=${DB_READER_DB:-lab};Username=app_user;Password=${APP_DB_PASSWORD};Timeout=3;Command Timeout=10;Keepalive=10;Minimum Pool Size=${DB_MIN_POOL:-0};Maximum Pool Size=${DB_POOL:-20};Connection Lifetime=60;Load Balance Hosts=true${DB_EXTRA:-}"
      Database__EnsureSchema: "false"
      Resilience__WriteRetryWindowSeconds: "60"
    depends_on:
      haproxy1: { condition: service_started }
      haproxy2: { condition: service_started }
      redis: { condition: service_healthy }
      pgbouncer: { condition: service_started }

  # ---- Load balancer in front of the API instances ---------------------------------------
  lb:
    image: haproxy:2.9-alpine
    restart: unless-stopped
    ports:
      - "5101:8080"        # the API, load balanced: http://localhost:5101
      - "7003:7000"        # stats: http://localhost:7003
    volumes:
      - ./config/haproxy-lb.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on: [api]

  # ---- Connection pooler ---------------------------------------------------------------
  # Always running, but the API only uses it when DB_WRITER_HOST / DB_READER_HOST point at it (see the api service).
  pgbouncer:
    image: edoburu/pgbouncer@sha256:8638aa563607256d3c7440437534195f1066a92b68015d89ae9d6b935b444a6d   # PgBouncer 1.26.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ['printf "\"app_user\" \"%s\"
" "$$APP_DB_PASSWORD" > /tmp/userlist.txt && exec /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini']
    environment:
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - ./config/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    depends_on: [haproxy1]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256m }

  # ---- Backup job (run on demand: docker compose run --rm backup) ----------------------
  backup:
    image: patroni-lab-node:pg16
    profiles: ["tools"]
    entrypoint: ["/bin/bash", "/scripts/backup.sh"]
    environment:
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?}
    volumes:
      - ./scripts:/scripts:ro
      - wal-archive:/archive:ro
      - backups:/backups
    depends_on: [haproxy1]

volumes:
  etcd1-data:
  etcd2-data:
  etcd3-data:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  wal-archive:
  backups:
