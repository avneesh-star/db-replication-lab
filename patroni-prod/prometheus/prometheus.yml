global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: patroni
    metrics_path: /metrics
    static_configs:
      - targets: ["pg-node1:8008", "pg-node2:8008", "pg-node3:8008", "pg-node4:8008"]
  - job_name: etcd
    metrics_path: /metrics
    static_configs:
      - targets: ["etcd1:2379", "etcd2:2379", "etcd3:2379"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: haproxy
    static_configs:
      - targets: ["haproxy1:8405", "haproxy2:8405"]
