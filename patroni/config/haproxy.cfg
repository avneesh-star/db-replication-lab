global
    maxconn 200

defaults
    mode tcp
    timeout connect 5s
    timeout client 30m
    timeout server 30m

resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 1s

# Web page showing which node HAProxy considers up: http://localhost:7000
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 2s

# Write endpoint: only the node whose /primary check returns 200 (the leader).
listen primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 1 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server pg-node1 pg-node1:5432 check port 8008
    server pg-node2 pg-node2:5432 check port 8008
    server pg-node3 pg-node3:5432 check port 8008

# Read endpoint: every healthy replica, round robin.
listen replicas
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 1 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server pg-node1 pg-node1:5432 check port 8008
    server pg-node2 pg-node2:5432 check port 8008
    server pg-node3 pg-node3:5432 check port 8008
