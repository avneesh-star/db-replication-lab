<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Failover Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1c2330; --muted: #66707f; --line: #dfe3ea;
    --ok: #1a7f4b; --okbg: #e3f4ea; --bad: #b3261e; --badbg: #fbe7e5;
    --lead: #1d4ed8; --leadbg: #e2ebff; --warn: #8a5a00; --warnbg: #fff1cc; --btn: #1c2330;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #98a1b0; --line: #2d3442;
      --ok: #5fd195; --okbg: #17352a; --bad: #ff8f86; --badbg: #3d1d1a;
      --lead: #8fb2ff; --leadbg: #1c2c52; --warn: #f2c45a; --warnbg: #3a2e0f; --btn: #e6e9ef;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card h2 { font-size: 16px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
  .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
  .leader { background: var(--leadbg); color: var(--lead); }
  .replica { background: var(--okbg); color: var(--ok); }
  .down { background: var(--badbg); color: var(--bad); }
  .other { background: var(--warnbg); color: var(--warn); }
  dl { margin: 0 0 10px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; }
  button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--text); }
  button:hover { border-color: var(--btn); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .4; cursor: default; }
  .panel { margin-top: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .stat { min-width: 140px; }
  .stat b { display: block; font-size: 24px; }
  .stat span { color: var(--muted); font-size: 12px; }
  #status { font-weight: 600; }
  .up { color: var(--ok); } .dn { color: var(--bad); }
  #log { height: 240px; overflow: auto; font: 12px/1.5 ui-monospace, Consolas, monospace;
         background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  #log .e { color: var(--bad); } #log .s { color: var(--ok); } #log .i { color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>PostgreSQL failover dashboard</h1>
  <p class="sub">Writes go through the HAProxy write endpoint (:5000), reads through the read endpoint (:5001). Stop the leader and watch the cluster recover.</p>

  <div class="grid" id="nodes"></div>

  <div class="card panel">
    <div class="row">
      <div class="stat"><b id="status" class="up">idle</b><span>write endpoint</span></div>
      <div class="stat"><b id="server">-</b><span>last write served by</span></div>
      <div class="stat"><b id="downtime">-</b><span>last outage</span></div>
      <div class="stat"><b id="rows">-</b><span>rows (read endpoint)</span></div>
      <div class="stat"><b id="okfail">0 / 0</b><span>writes ok / failed</span></div>
      <div style="margin-left:auto">
        <button id="toggle">Start write test</button>
      </div>
    </div>
  </div>

  <div class="card panel">
    <h2 style="font-size:15px;margin:0 0 8px">Events</h2>
    <div id="log"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let running = false, ok = 0, fail = 0, outageStart = null, prevLeader = null, prevServer = null;

function log(msg, cls = "i") {
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = new Date().toLocaleTimeString() + "  " + msg;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}

async function post(path) {
  const r = await fetch(path, { method: "POST" });
  return r.json();
}

async function act(action, node) {
  log(`${action} ${node} requested`);
  const r = await post(`/api/${action}/${node}`);
  if (!r.ok) log(`${action} ${node} failed (docker status ${r.status})`, "e");
  refresh();
}

function renderNodes(nodes) {
  const el = $("nodes");
  el.innerHTML = "";
  for (const n of nodes) {
    const cls = n.role === "leader" ? "leader" : n.role === "replica" ? "replica" : n.role === "down" ? "down" : "other";
    const running = n.container === "running";
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h2>${n.name}<span class="badge ${cls}">${n.role === "down" ? "down" : n.role}</span></h2>
      <dl>
        <dt>container</dt><dd>${n.container}</dd>
        <dt>state</dt><dd>${n.state ?? "-"}</dd>
        <dt>timeline</dt><dd>${n.timeline ?? "-"}</dd>
      </dl>
      <button class="danger" ${running ? "" : "disabled"} onclick="act('stop','${n.name}')">Stop</button>
      <button ${running ? "disabled" : ""} onclick="act('start','${n.name}')">Start</button>`;
    el.appendChild(card);
  }
}

async function refresh() {
  try {
    const s = await (await fetch("/api/state")).json();
    renderNodes(s.nodes);
    const leader = (s.nodes.find(n => n.role === "leader") || {}).name || null;
    if (leader !== prevLeader) {
      if (prevLeader !== null || leader) log(leader ? `leader is ${leader}` + (prevLeader ? ` (was ${prevLeader})` : "") : "no leader", leader ? "s" : "e");
      prevLeader = leader;
    }
    $("rows").textContent = s.read.ok ? s.read.rows : "n/a";
  } catch (e) {
    log("dashboard cannot reach its backend", "e");
  }
}

async function tick() {
  if (!running) return;
  const r = await post("/api/write");
  if (r.ok) {
    ok++;
    if (outageStart !== null) {
      const secs = ((Date.now() - outageStart) / 1000).toFixed(1);
      $("downtime").textContent = secs + " s";
      log(`writes recovered after ${secs} s, served by ${r.server}`, "s");
      outageStart = null;
    }
    if (r.server !== prevServer) { if (prevServer) log(`write endpoint now served by ${r.server}`, "s"); prevServer = r.server; }
    $("status").textContent = "writing"; $("status").className = "up";
    $("server").textContent = r.server;
  } else {
    fail++;
    if (outageStart === null) { outageStart = Date.now(); log("write failed: " + r.error, "e"); }
    $("status").textContent = "failing"; $("status").className = "dn";
  }
  $("okfail").textContent = `${ok} / ${fail}`;
}

$("toggle").onclick = () => {
  running = !running;
  $("toggle").textContent = running ? "Stop write test" : "Start write test";
  if (!running) { $("status").textContent = "idle"; $("status").className = "up"; }
  log(running ? "write test started (1 write per second)" : "write test stopped");
};

setInterval(refresh, 1500);
setInterval(tick, 1000);
refresh();
log("dashboard ready");
</script>
</body>
</html>
